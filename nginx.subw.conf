server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;
    port_in_redirect off;

    error_page 418 = @root_index;

    location = /subw {
        return 302 /subw/;
    }

    # 直连宿主机映射端口 / → 302 /subw/；NPM 剥前缀（X-Forwarded-Prefix）→ 返回 index.html
    location = / {
        if ($http_x_forwarded_prefix = "/subw") {
            return 418;
        }
        return 302 /subw/;
    }

    location @root_index {
        try_files /index.html =404;
    }

    # 页面引用 /subw/assets/...，磁盘在 /assets/...
    location /subw/ {
        rewrite ^/subw/((.*))$ /$1 break;
        try_files $uri $uri/ /index.html;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
